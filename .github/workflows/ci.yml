# Unity Loom CI.
#
# Six jobs, each proving exactly one thing:
#
#   validate       the repository contracts hold on every supported OS and Node
#   install        the install path works end to end on a clean destination
#   links          every relative markdown link in the tree resolves on disk
#   secrets        no credential material in the working tree or in the history
#   editor-tests   optional Unity EditMode and PlayMode tests, manual only
#   release        a versioned archive is published when a v* tag is pushed
#
# The repository is offline-first: the content checks need no network, so a
# network flake can never hide a real failure. The two jobs that do use the
# network (secrets, editor-tests) are the two that are allowed to be slow.
#
# Every action is pinned to a full commit SHA, with the human-readable tag in
# a trailing comment. A tag is a mutable pointer: whoever controls the tag can
# repoint it at a new commit, and a mutable pointer is a remote code execution
# path into this workflow. A SHA cannot move. The tags are checked by
# `dependabot.yml`, so a pinned action still receives security updates; the
# bump arrives as a pull request, reviewed like any other change.
#
#   actions/checkout                  3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
#   actions/setup-node                949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
#   actions/upload-artifact           cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
#   gitleaks/gitleaks-action          e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
#   softprops/action-gh-release        5113cdc90fd4d541c801c55356214017bf5ae34b  # v3
#   game-ci/unity-test-runner         32e57712352b500e17974b245a6dce9e11a73213  # v4
#
# Secrets are never exposed to code that came from a pull request. A pull
# request can modify this repository's own tooling, and that tooling runs
# during the pull request, so any secret reachable from a pull-request run is
# a secret reachable from whoever opened it. The rules that need a secret run
# on a push to `main` or on a manual dispatch, where the code is already
# reviewed and merged.

name: ci

# There is no `paths-ignore` filter on this workflow, deliberately.
#
# Every file in this repository is contract-bearing, including the markdown:
# a skill, a workflow and a doctrine file are `.md` files, and the validator
# exists to police exactly those. Filtering `**/*.md` out of the trigger meant
# a pull request that edited a skill never reached the validator, so trigger
# drift, a budget overrun and a broken link could land unreviewed.
#
# A filter also applies to tag pushes. A `v*` tag on a commit that touched
# only a document would have skipped the release job, and the version would
# never have been published.
#
# The jobs are offline, dependency-free and finish in about a minute, so the
# honest trade is a runner per push in exchange for a contract that is always
# checked.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      unity-project-path:
        description: "Path to the Unity project that holds the EditMode and PlayMode tests"
        required: false
        default: "UnityProject"

# The workflow reads the repository and nothing else. The release job is the
# only one that needs more, and it says so.
#
# `id-token` is never granted. It is the permission that lets a workflow mint
# a token for a third-party service, so a workflow that does not need it must
# not ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release tag is never cancelled: the artefact has to be produced.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ------------------------------------------------------------------ validate
  validate:
    name: validate (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One broken combination must not hide the state of the other five.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The token is not left in the checkout. Nothing in this workflow
          # pushes, and a credential on disk is a credential a compromised
          # build step can read.
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Self-test the validator
        run: node tools/validate.mjs --selftest

      - name: Validate Unity Loom
        run: node tools/validate.mjs

      - name: Write the machine-readable report
        # The report is written even when the validation failed: the summary
        # and the artefact are the diagnosis.
        if: always()
        shell: bash
        run: node tools/validate.mjs --json > validate-report.json

      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validate-report-${{ matrix.os }}-node${{ matrix.node }}
          path: validate-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/summary.mjs" <<'EOF'
          import { readFileSync, appendFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("validate-report.json", "utf8"));
          const s = report.summary;
          const out = [];
          out.push("### Unity Loom validation");
          out.push("");
          out.push("Runner: ${{ matrix.os }}, Node ${{ matrix.node }}");
          out.push("");
          out.push("| Check | Result |");
          out.push("|---|---|");
          out.push("| Overall | " + (report.ok ? "PASS" : "FAIL") + " |");
          out.push("| Skills | " + s.skills + " of " + s.maxSkills + " |");
          out.push("| Workflows | " + s.workflows + " of " + s.maxWorkflows + " |");
          out.push("| Core bytes | " + s.coreBytes + " of " + s.totalCoreBytes + " |");
          out.push("| Triggers | " + s.triggers + " unique, " + s.collisions + " collisions |");
          out.push("| Problems | " + report.problemCount + " |");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          EOF
          node "$RUNNER_TEMP/summary.mjs"

  # ------------------------------------------------------------------- install
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Plan the installation
        run: node tools/install.mjs plan --dest "${{ runner.temp }}/loom-skills"

      - name: Install into a clean destination
        run: node tools/install.mjs install --dest "${{ runner.temp }}/loom-skills"

      - name: Verify the installed copy against the repository
        run: node tools/install.mjs verify --dest "${{ runner.temp }}/loom-skills"

      - name: Doctor the installation
        run: node tools/install.mjs doctor --dest "${{ runner.temp }}/loom-skills"

      - name: Assert that every installed relative link resolves
        # The installer rewrites the `../../` prefix in the installed skill
        # copies. This step proves the rewritten links still point at files
        # that exist in the installed tree, which is the failure the install
        # path is meant to prevent.
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/check-installed-links.mjs" <<'EOF'
          import { readFileSync, readdirSync, existsSync } from "node:fs";
          import { join, dirname, relative, extname, sep, posix } from "node:path";

          const root = process.argv[2];
          const files = [];
          const walk = (dir) => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const full = join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          };
          walk(root);
          const rel = (p) => relative(root, p).split(sep).join("/");

          let broken = 0;
          for (const abs of files) {
            const p = rel(abs);
            if (extname(p).toLowerCase() !== ".md") continue;
            const text = readFileSync(abs, "utf8");
            const re = /\[[^\]]*\]\(([^)\s]+)\)/g;
            let m;
            while ((m = re.exec(text)) !== null) {
              let target = m[1];
              if (/^(https?:|mailto:|tel:|#)/i.test(target)) continue;
              target = target.split("#")[0];
              if (target === "") continue;
              const resolved = posix.normalize(posix.join(posix.dirname(p), target));
              if (resolved.startsWith("..")) continue;
              if (!existsSync(join(root, resolved))) {
                console.error(p + ": broken installed link -> " + target);
                broken++;
              }
            }
          }
          if (broken === 0) console.log("every installed relative link resolves");
          else console.error(broken + " broken installed link(s)");
          process.exit(broken === 0 ? 0 : 1);
          EOF
          node "$RUNNER_TEMP/check-installed-links.mjs" "$RUNNER_TEMP/loom-skills"

  # --------------------------------------------------------------------- links
  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Check every relative markdown link
        # The scan is offline and dependency-free: it walks the working tree,
        # resolves each relative link against the file that carries it, and
        # fails on the first one that does not exist on disk.
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/check-links.mjs" <<'EOF'
          import { readFileSync, readdirSync, existsSync } from "node:fs";
          import { join, dirname, relative, extname, sep, posix } from "node:path";

          const root = process.cwd();
          const skip = new Set([".git", "node_modules", ".vscode"]);
          const files = [];
          const walk = (dir) => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              if (skip.has(entry.name)) continue;
              const full = join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          };
          walk(root);

          const rel = (p) => relative(root, p).split(sep).join("/");

          let broken = 0;
          let checked = 0;
          for (const abs of files) {
            const p = rel(abs);
            if (extname(p).toLowerCase() !== ".md") continue;
            const text = readFileSync(abs, "utf8");
            const re = /\[[^\]]*\]\(([^)\s]+)\)/g;
            let m;
            while ((m = re.exec(text)) !== null) {
              let target = m[1];
              if (/^(https?:|mailto:|tel:|#)/i.test(target)) continue;
              target = target.split("#")[0];
              if (target === "") continue;
              checked++;
              const resolved = posix.normalize(posix.join(posix.dirname(p), target));
              if (resolved.startsWith("..")) continue;
              if (!existsSync(join(root, resolved))) {
                console.error(p + ": broken link -> " + target);
                broken++;
              }
            }
          }
          console.log("checked " + checked + " relative link(s)");
          if (broken === 0) console.log("every relative link resolves");
          else console.error(broken + " broken link(s)");
          process.exit(broken === 0 ? 0 : 1);
          EOF
          node "$RUNNER_TEMP/check-links.mjs"

  # ------------------------------------------------------------------- secrets
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The history scan needs every commit, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the git history
        # The action runs the gitleaks detector over the checked-out history
        # and fails the job on a finding. It is pinned to a commit digest.
        #
        # gitleaks-action v3 takes no inputs: it always runs
        # `gitleaks detect --redact`, so a finding is reported with the
        # secret masked, and it scopes the scan to the event — the whole
        # history on a push, the pull request's commits on a pull request.
        #
        # The only credential in this job is `GITHUB_TOKEN`, the workflow's
        # own read-only token, which the action needs to read a pull request.
        # No repository secret is reachable from a pull-request run: the
        # gitleaks licence is not needed for a personal repository, and an
        # organisation that forks this repository adds the licence to the
        # trusted path only.
        #
        # The validator's own `secrets` rule runs in the `validate` job and
        # scans every tracked file, so a credential-shaped string in the tree
        # is caught by two independent checks before a merge.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ----------------------------------------------------------------- signature
  signature:
    name: signature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a push to `main`. This job is the enforcement that survives the
    # administrator bypass: an administrator may merge without a review, so
    # the commit that lands on `main` is checked here instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the signature of the tip commit
        # The branch protection requires signed commits, and GitHub accepts a
        # signature only when it can verify it. A key that is registered for
        # authentication but not as a signing key produces a signature
        # GitHub reports as `unknown_key`, which does not satisfy the rule.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.commit.verification')"
          verified="$(printf '%s' "$verification" | jq -r '.verified')"
          reason="$(printf '%s' "$verification" | jq -r '.reason')"
          signer="$(printf '%s' "$verification" | jq -r '.signature | if . == null then "none" else "present" end')"
          if [ "$verified" != "true" ]; then
            echo "The tip commit ${sha} is not signed with a verified signature." >&2
            echo "  verification reason: ${reason}" >&2
            echo "  signature: ${signer}" >&2
            echo "Register the signing key on the account, or merge through a pull request." >&2
            exit 1
          fi
          echo "The tip commit ${sha} carries a verified signature (${reason})."

  # -------------------------------------------------------------- editor-tests
  editor-tests:
    name: editor-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A pull request never runs this job, so a fork can never be blocked by a
    # job it has no Unity licence for. It runs on a manual dispatch only.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      # The secret is read into the job environment so that a missing licence
      # is a skip, never a failure. A manual dispatch runs trusted code.
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Report the licence state
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "The UNITY_LICENSE secret is not set, so the Unity tests are skipped."
          else
            echo "The Unity licence secret is set, so the Unity tests run."
          fi

      - name: Locate the Unity project
        id: project
        shell: bash
        run: |
          path="${{ inputs.unity-project-path }}"
          if [ -d "$path/Assets" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "The Unity project is at $path."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Unity project is at $path, so the Unity tests are skipped."
          fi

      - name: Run the EditMode tests
        if: env.UNITY_LICENSE != '' && steps.project.outputs.found == 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        with:
          projectPath: ${{ inputs.unity-project-path }}
          testMode: EditMode
          unityVersion: ${{ vars.UNITY_VERSION || '6000.3' }}
          artifactsPath: artifacts/editmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Run the PlayMode tests
        if: env.UNITY_LICENSE != '' && steps.project.outputs.found == 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        with:
          projectPath: ${{ inputs.unity-project-path }}
          testMode: PlayMode
          unityVersion: ${{ vars.UNITY_VERSION || '6000.3' }}
          artifactsPath: artifacts/playmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Upload the test artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unity-test-results
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------- release
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # The release job is the only job that writes to the repository.
      contents: write
      # The attestation step needs an OIDC token to sign the provenance
      # statement. It is requested here and nowhere else in this workflow.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Check that the tag matches the manifest version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "The tag $tag does not match the manifest version $version." >&2
            exit 1
          fi
          echo "The tag $tag matches the manifest version $version."

      - name: Validate Unity Loom
        run: node tools/validate.mjs

      - name: Package the skills, the shared corpus and the tools
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R skills workflows doctrine references docs tools dist/
          for f in manifest.json AGENTS.md README.md GUIDE.md HARNESSES.md CONTRIBUTING.md CONTRIBUTORS.md CODE_OF_CONDUCT.md SECURITY.md ROADMAP.md LICENSE; do
            if [ -f "$f" ]; then
              cp "$f" dist/
            else
              echo "note: $f is not in the tree yet, so it is not packaged."
            fi
          done
          cd dist
          zip -r "../unity-loom-$GITHUB_REF_NAME.zip" .
          cd ..
          ls -l "unity-loom-$GITHUB_REF_NAME.zip"

      - name: Attest the release archive
        # The attestation says who built this archive, from which commit, and
        # under which workflow. A consumer that verifies the attestation can
        # tell the published artefact from one that was substituted after the
        # fact. The `id-token` permission is requested here and nowhere else,
        # and only in the job that signs.
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: "unity-loom-${{ github.ref_name }}.zip"

      - name: Publish the release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: unity-loom-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
